# node_modules plano: electron-builder no resuelve bien los enlaces simbólicos de pnpm al empaquetar
nodeLinker: hoisted
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  # Instalador de Windows: no se usa (la app solo se empaqueta para macOS)
  electron-winstaller: false
overrides:
  # lazystream pide readable-stream/passthrough, que solo existe en la v2
  lazystream>readable-stream: ^2.3.8
  # Versiones corregidas de dependencias internas con avisos de seguridad (auditoría 25-oct-2026)
  engine.io: ^6.6.10
  body-parser: ^2.4.0
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  uuid@8: ^11.1.1
  http-cache-semantics: ^4.2.1
  brace-expansion@5: ^5.0.12
  source-map-js: ^1.2.2
  # rehype-katex trae su propia KaTeX vieja: se alinea con la del proyecto
  katex: ^0.19.1
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.123.0'
