# nginx para portal.ejemplo.com: portal de alumnos de App_Docente (Node en 127.0.0.1:3280, servicio docente-portal)
#
#   cp despliegue/nginx-docente.conf /etc/nginx/sites-available/docente
#   ln -s /etc/nginx/sites-available/docente /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d portal.ejemplo.com      (agrega el bloque HTTPS)

server {
    server_name portal.ejemplo.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Entregas: 5 archivos de 50 MB por subida. La sincronización de la app sube la base completa (~3 MB hoy)
    client_max_body_size 300m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3280;
        proxy_http_version 1.1;
        # Concursos en vivo (socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    listen 80;
}
